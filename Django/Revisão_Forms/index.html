<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <form>
        <label>Nome:</label>
            <input 
            type="text" 
            id="nome"
            name="nome"
            placeholder="Digite seu nome"
            required
            >

            <textarea name="mensagem" rows="5" cols="30"></textarea>

            <select name="curso">
                <option value="informatica">Informatica</option>
                <option value="edificacoes">Edificações</option>
                <option value="eletro">Eletrotécnicas</option>
            </select>

            <button type="submit">Submit</button>
    </form>
    
</body>
</html>
